# Builds the Linux program (a static x86_64 binary) and attaches it to a release:
# automatically when a release is published, or by hand for an existing tag.
name: Linux build

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the tar.gz to (leave empty to only build)
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: swift:6.4.2-jammy
    steps:
      # zip and unzip are for the tests (they build and read zipped ROMs).
      - name: Install tools
        run: apt-get update && apt-get install -y zip unzip git

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag || github.ref }}

      - name: Test
        run: swift test

      # Same version as the toolchain; the checksum is the one swift.org lists for the Static Linux SDK.
      - name: Install Static Linux SDK
        run: swift sdk install https://download.swift.org/swift-6.4.2-release/static-sdk/swift-6.4.2-RELEASE/swift-6.4.2-RELEASE_static-linux-0.1.0.artifactbundle.tar.gz --checksum 3786b179936d9cc9e266dd506bd1654176358d7b25288e243359f4d17cc4dc5a

      - name: Build
        run: swift build -c release --swift-sdk x86_64-swift-linux-musl --product SteamRetroAchievements -Xlinker -s

      - name: Package
        run: |
          out=steam-retroachievements-linux
          mkdir "$out"
          cp .build/release/SteamRetroAchievements "$out/steam-retroachievements"
          cp steam/inject.js "$out/"
          cp docs/icon.png "$out/icon.png"
          tar -czf "$out.tar.gz" "$out"

      - uses: actions/upload-artifact@v4
        with:
          name: steam-retroachievements-linux
          path: steam-retroachievements-linux.tar.gz

  attach:
    needs: build
    if: github.event.release.tag_name || inputs.tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: steam-retroachievements-linux
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" steam-retroachievements-linux.tar.gz --clobber --repo "${{ github.repository }}"
